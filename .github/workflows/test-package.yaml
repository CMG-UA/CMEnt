# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
name: Bioconductor package checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test-package.yaml"
      - ".github/workflows/prepare-cment-env-image.yaml"
      - ".github/docker/cment-env/**"
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "tests/**"
      - "vignettes/**"
      - "inst/**"
      - "src/**"
  # push:
  #   branches:
  #     - main
  #     - master
  #     - devel
  #   paths:
  #     - ".github/workflows/test-package.yaml"
  #     - ".github/workflows/prepare-cment-env-image.yaml"
  #     - ".github/docker/cment-env/**"
  #     - "DESCRIPTION"
  #     - "NAMESPACE"
  #     - "R/**"
  #     - "man/**"
  #     - "tests/**"
  #     - "vignettes/**"
  #     - "inst/**"
  #     - "src/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  CI: true

jobs:
  prepare-image:
    name: Prepare CI image
    uses: ./.github/workflows/prepare-cment-env-image.yaml
    with:
      dockerfile: ".github/docker/cment-env/Dockerfile"
      docker_context: "."
      docker_dir: ".github/docker/cment-env"
      image_suffix: "cment-env"

  check:
    name: R CMD check
    needs:
      - prepare-image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ needs.prepare-image.outputs.image_uri }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Show session info
        shell: Rscript {0}
        run: |
          sessionInfo()
          cat("Bioconductor version:", as.character(BiocManager::version()), "\n")

      - name: Check package
        uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'
          upload-results: always
          upload-snapshots: always
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf", "--output=/tmp")'

  bioccheck:
    name: BiocCheck
    needs:
      - prepare-image
      - check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ${{ needs.prepare-image.outputs.image_uri }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Run BiocCheck
        id: bioccheck
        continue-on-error: true
        shell: Rscript {0}
        run: |
          if (dir.exists("CMEnt.BiocCheck")) {
            unlink("CMEnt.BiocCheck", recursive = TRUE)
          }
          BiocCheck::BiocCheck(
            ".",
            `new-package` = TRUE,
            `quit-with-status` = TRUE
          )

      - name: Upload BiocCheck reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioccheck-results
          path: |
            ./*.BiocCheck
            ./*.BiocCheck/**
          if-no-files-found: ignore

      - name: Run BiocCheckGitClone
        id: bioccheck_git
        continue-on-error: true
        shell: Rscript {0}
        run: |
          if (dir.exists("CMEnt.BiocCheck")) {
            unlink("CMEnt.BiocCheck", recursive = TRUE)
          }
          BiocCheck::BiocCheckGitClone(
            ".",
            `quit-with-status` = TRUE
          )

      - name: Fail if BiocCheck reported errors or warnings
        if: ${{ steps.bioccheck.outcome != 'success' || steps.bioccheck_git.outcome != 'success' }}
        run: |
          echo "BiocCheck reported issues."
          exit 1

  test_and_coverage:
    name: Tests and coverage
    needs:
      - prepare-image
      - check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ needs.prepare-image.outputs.image_uri }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install test dependencies
        shell: bash {0}
        run: |
          # Instal gpg,git,curl for codecov upload
          apt-get update && apt-get install -y --no-install-recommends \
            gpg \
            git \
            curl
          # Install test dependencies
          Rscript -e 'install.packages(c("covr", "testthat"))'
      
      - uses: actions/checkout@v4
      - name: Run coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(
            path = ".",
            quiet = FALSE,
            clean = FALSE,
            type = "tests",
            install_path = file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package"
            )
          )
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-results
          path: |
            cobertura.xml
            ${{ runner.temp }}/package
          if-no-files-found: ignore

      - uses: codecov/codecov-action@v5
        if: ${{ hashFiles('cobertura.xml') != '' }}
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
