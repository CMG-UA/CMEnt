name: Build and deploy documentation to GitHub Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  prepare-image:
    uses: ./.github/workflows/prepare-cment-env-notebooks-image.yaml
    with:
      dockerfile: ".github/docker/cment-env-notebooks/Dockerfile"
      docker_context: "."
      docker_dir: ".github/docker/cment-env-notebooks"
      image_suffix: "cment-env-notebooks"
  render:
    runs-on: ubuntu-latest

    needs:
      - prepare-image

    container:
      image: ${{ needs.prepare-image.outputs.image_uri  }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install current package source
        run: |
          R CMD INSTALL .

      - name: Build pkgdown site and render notebooks
        shell: Rscript {0}
        run: |
          site_dir <- "_site"
          articles_dir <- file.path(site_dir, "articles")

          pkgdown::build_site(
            examples = FALSE,
            install = FALSE,
            new_process = TRUE,
            quiet = FALSE
          )
          dir.create(articles_dir, recursive = TRUE, showWarnings = FALSE)

          notebooks <- list.files(
            "notebooks",
            pattern = "\\.Rmd$",
            full.names = TRUE
          )

          if (length(notebooks) == 0L) {
            message("No Rmd notebooks found.")
          } else {
            for (nb in notebooks) {
              message("Rendering: ", nb)

              out_file <- paste0(
                tools::file_path_sans_ext(basename(nb)),
                ".html"
              )

              rmarkdown::render(
                input = nb,
                output_dir = articles_dir,
                output_file = out_file,
                output_options = list(code_folding = "hide"),
                envir = new.env(parent = globalenv()),
                quiet = FALSE
              )
            }
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    runs-on: ubuntu-latest
    needs: render

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
