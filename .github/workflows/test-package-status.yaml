name: Test package status

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional ci.yaml workflow run ID to mirror"
        required: false
        type: string
  workflow_run:
    workflows:
      - CMEnt CI, including package checks, Docker image build, and notebook rendering
    types:
      - completed

permissions:
  actions: read

jobs:
  mirror-test-package:
    name: Mirror test-package result
    runs-on: ubuntu-latest

    steps:
      - name: Mirror reusable workflow result
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function latestCompletedCiRunId() {
              const branch = context.ref.replace("refs/heads/", "");
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "ci.yaml",
                branch,
                status: "completed",
                per_page: 1
              });

              const run = response.data.workflow_runs[0];
              if (!run) {
                throw new Error(`No completed ci.yaml runs found on ${branch}.`);
              }
              return run.id;
            }

            const runId = context.eventName === "workflow_run"
              ? context.payload.workflow_run.id
              : (context.payload.inputs.run_id || await latestCompletedCiRunId());

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: runId,
              filter: "latest",
              per_page: 100
            });

            let testJobs = jobs.filter((job) =>
              job.name === "Test package" ||
              job.name.startsWith("Test package /") ||
              job.name.startsWith("test-package /")
            );

            if (testJobs.length === 0) {
              const names = new Set([
                "Prepare CI image",
                "R CMD check",
                "BiocCheck",
                "Tests and coverage"
              ]);
              testJobs = jobs.filter((job) => names.has(job.name));
            }

            if (testJobs.length === 0) {
              throw new Error(`No test-package jobs found in ci.yaml run ${runId}.`);
            }

            const failed = testJobs.filter((job) =>
              !["success", "skipped"].includes(job.conclusion)
            );

            for (const job of testJobs) {
              core.info(`${job.name}: ${job.conclusion}`);
            }

            if (failed.length > 0) {
              const names = failed.map((job) => `${job.name} (${job.conclusion})`).join(", ");
              core.setFailed(`Reusable test-package failed in ci.yaml run ${runId}: ${names}`);
            }
