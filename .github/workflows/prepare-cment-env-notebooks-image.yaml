name: Prepare cment-env-notebooks image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: ".github/docker/cment-env-notebooks/Dockerfile"
      docker_context:
        required: false
        type: string
        default: "."
      docker_dir:
        required: false
        type: string
        default: ".github/docker/cment-env-notebooks"
      image_suffix:
        required: false
        type: string
        default: "cment-env-notebooks"
      base_dockerfile:
        required: false
        type: string
        default: ".github/docker/cment-env/Dockerfile"
      base_docker_context:
        required: false
        type: string
        default: "."
      base_docker_dir:
        required: false
        type: string
        default: ".github/docker/cment-env"
      base_image_suffix:
        required: false
        type: string
        default: "cment-env"
    outputs:
      image_name:
        description: "GHCR image name without tag"
        value: ${{ jobs.init-params.outputs.image_name }}
      image_tag:
        description: "Dependency hash image tag"
        value: ${{ jobs.init-params.outputs.requirements_hash }}
      image_uri:
        description: "Full image URI"
        value: ${{ jobs.init-params.outputs.image_uri }}

permissions:
  contents: read
  packages: write

jobs:
  prepare-base-image:
    uses: ./.github/workflows/prepare-cment-env-image.yaml
    secrets: inherit
    with:
      dockerfile: ${{ inputs.base_dockerfile }}
      docker_context: ${{ inputs.base_docker_context }}
      docker_dir: ${{ inputs.base_docker_dir }}
      image_suffix: ${{ inputs.base_image_suffix }}

  init-params:
    runs-on: ubuntu-latest
    container: rocker/r2u:24.04
    needs: prepare-base-image

    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
      requirements_hash: ${{ steps.hash.outputs.requirements_hash }}
      image_uri: ${{ steps.meta.outputs.image_name }}:${{ steps.hash.outputs.requirements_hash }}
      base_image_uri: ${{ needs.prepare-base-image.outputs.image_uri }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Define image name
        id: meta
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.image_suffix }}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Compute requirements hash
        id: hash
        shell: bash
        run: |
          HASH=$({
            printf '%s\n' "${{ needs.prepare-base-image.outputs.image_uri }}"
            sha256sum \
            "${{ inputs.docker_dir }}/cran-requirements.txt" \
            "${{ inputs.docker_dir }}/bioc-requirements.txt" \
            "${{ inputs.docker_dir }}/install-requirements.R" \
            "${{ inputs.dockerfile }}"
          } | sha256sum | cut -d ' ' -f 1)

          echo "requirements_hash=${HASH}" >> "$GITHUB_OUTPUT"

  check-image:
    runs-on: ubuntu-latest
    needs: init-params

    outputs:
      image_exists: ${{ steps.check.outputs.image_exists }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether dependency image already exists
        id: check
        shell: bash
        run: |
          IMAGE="${{ needs.init-params.outputs.image_uri }}"

          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "image_exists=true" >> "$GITHUB_OUTPUT"
            echo "Found existing image: $IMAGE"
          else
            echo "image_exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet: $IMAGE"
          fi

  build-image:
    runs-on: ubuntu-latest
    needs:
      - init-params
      - check-image

    if: needs.check-image.outputs.image_exists != 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push notebook render image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ needs.init-params.outputs.image_uri }}
            ${{ needs.init-params.outputs.image_name }}:latest
          build-args: |
            BASE_IMAGE=${{ needs.init-params.outputs.base_image_uri }}
          cache-from: |
            type=gha,scope=${{ inputs.image_suffix }}
            type=registry,ref=${{ needs.init-params.outputs.image_name }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=${{ inputs.image_suffix }}
            type=registry,ref=${{ needs.init-params.outputs.image_name }}:buildcache,mode=max
