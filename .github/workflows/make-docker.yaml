name: Prepare cment image

on:
  workflow_call:
    inputs:
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      docker_context:
        required: false
        type: string
        default: "."
      docker_dir:
        required: false
        type: string
        default: "."
      image_suffix:
        required: false
        type: string
        default: "cment"
    outputs:
      image_name:
        description: "GHCR image name without tag"
        value: ${{ jobs.build-image.outputs.image_name }}

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - name: Define image name
        id: meta
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.image_suffix }}"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push notebook render image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker_context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
          cache-from: |
            type=gha,scope=${{ inputs.image_suffix }}
            type=registry,ref=${{ steps.meta.outputs.image_name }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=${{ inputs.image_suffix }}
            type=registry,ref=${{ steps.meta.outputs.image_name }}:buildcache,mode=max